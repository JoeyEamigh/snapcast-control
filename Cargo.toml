[package]
name = "snapcast-control"
version = "0.4.1"
edition = "2024"
resolver = "3"
rust-version = "1.85"
description = "a wrapper for the Snapcast JSON-RPC Control API based on tokio"
repository = "https://github.com/JoeyEamigh/snapcast-control.git"
documentation = "https://docs.rs/snapcast-control"
homepage = "https://github.com/JoeyEamigh/snapcast-control"
keywords = ["snapcast", "api-client"]
readme = "README.md"
license = "MIT"

[dependencies]
dashmap = "6.2.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.17.0", features = ["json"] }
stubborn-io = "0.3.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "io-util"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
] }

[package.metadata.docs.rs]
all-features = true

[lib]
doctest = false
